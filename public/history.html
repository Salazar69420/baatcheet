<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>History · baatcheet</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="bar">
    <a href="/" class="brand">baatcheet</a>
    <nav><a href="/history.html">History</a></nav>
  </header>

  <main class="history">
    <section id="listView" hidden>
      <h1>Calls &amp; voice notes</h1>
      <ul id="calls" class="call-list"></ul>
    </section>

    <section id="callView" hidden>
      <a href="/history.html" class="back">← All</a>
      <h1 id="callTitle">Call</h1>
      <p class="muted" id="callMeta"></p>
      <div class="toolbar">
        <div class="seg-toggle" role="group" aria-label="Transcript language">
          <button data-mode="both" class="on">Both</button>
          <button data-mode="english">English</button>
          <button data-mode="original">Original</button>
        </div>
        <a id="exportMd" class="btn" download>Export .md</a>
        <a id="exportTxt" class="btn" download>Export .txt</a>
        <button id="retry" class="btn" hidden>Retry failed chunks</button>
      </div>
      <p id="progress" class="muted"></p>
      <div id="transcript" class="transcript" data-mode="both">
        <p class="empty">No transcript yet.</p>
      </div>
    </section>
  </main>

  <script type="module" src="/js/history-page.js"></script>
</body>
</html>
