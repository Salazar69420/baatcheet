services:
  baatcheet:
    build: .
    container_name: baatcheet
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      DATA_DIR: /data
    # Only reachable from this machine. Expose it to your tailnet with:
    #   sudo tailscale serve --bg 3000
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    volumes:
      # Named volume: recordings + SQLite database. Back up with:
      #   docker run --rm -v baatcheet_data:/data -v "$PWD":/backup alpine tar czf /backup/baatcheet-backup.tgz -C /data .
      - data:/data

volumes:
  data:
